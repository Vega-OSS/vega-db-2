run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - revive
    - gocritic
    - gosec
    - errorlint
    - bodyclose
    - noctx
    - unconvert
    - misspell

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
